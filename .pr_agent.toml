# Qodo/PR-Agent remains installed at the GitHub app level, but automatic LLM
# feedback is disabled in favor of the deterministic review workflow.
[config]
disable_auto_feedback = true

[github_app]
pr_commands = []
handle_push_trigger = false
push_commands = []

[github_action_config]
auto_review = false
auto_describe = false
auto_improve = false
handle_push_trigger = false
push_commands = []
