name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or commit to package"
        required: true
        default: "development"
        type: string
      version:
        description: "Version shown by the installer"
        required: true
        default: "development"
        type: string
      release_tag:
        description: "Existing release tag to receive the installer (optional)"
        required: false
        type: string
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    env:
      PYTHON_MINOR: "3.14"
      FFMPEG_URL: "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
      FFMPEG_FALLBACK_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
    steps:
      - name: Validate manual release attachment
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.ref }}
          INSTALLER_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:SOURCE_REF -ne $env:RELEASE_TAG -or $env:INSTALLER_VERSION -ne $env:RELEASE_TAG) {
            throw 'ref, version, and release_tag must match when attaching an installer to a release.'
          }

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python for the Windows wheelhouse
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Restore FFmpeg archive cache
        uses: actions/cache@v4
        with:
          path: build/cache/ffmpeg.zip
          key: ffmpeg-windows-x64-${{ hashFiles('.github/workflows/windows-installer.yml') }}

      - name: Prepare installer payload
        shell: pwsh
        env:
          UA_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/payload/source | Out-Null
          New-Item -ItemType Directory -Force -Path build/cache | Out-Null
          git archive --format=zip --output build/payload/source.zip HEAD
          Expand-Archive -LiteralPath build/payload/source.zip -DestinationPath build/payload/source -Force

          function Test-FfmpegArchive([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path)) { return $false }
            try {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $Path))
              try {
                return $null -ne ($archive.Entries | Where-Object { $_.FullName -match '(^|/)bin/ffmpeg\.exe$' } | Select-Object -First 1)
              }
              finally {
                $archive.Dispose()
              }
            }
            catch {
              return $false
            }
          }

          function Invoke-DownloadWithRetry([string]$Uri, [string]$OutFile, [int]$Attempts = 3) {
            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing
                return
              }
              catch {
                Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
                if ($attempt -eq $Attempts) { throw }
                Start-Sleep -Seconds ([math]::Pow(2, $attempt))
              }
            }
          }

          $index = Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/' -UseBasicParsing
          $versions = [regex]::Matches($index.Content, "$env:PYTHON_MINOR\.\d+/") |
            ForEach-Object { $_.Value.TrimEnd('/') } |
            Select-Object -Unique |
            Sort-Object { [version]$_ } -Descending
          if (-not $versions) { throw "No Python $env:PYTHON_MINOR release was found." }
          $pythonVersion = $versions[0]
          Invoke-DownloadWithRetry -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-amd64.exe" -OutFile build/payload/python-installer.exe

          $cachedFfmpeg = 'build/cache/ffmpeg.zip'
          $payloadFfmpeg = 'build/payload/ffmpeg.zip'
          if (Test-FfmpegArchive -Path $cachedFfmpeg) {
            Copy-Item -LiteralPath $cachedFfmpeg -Destination $payloadFfmpeg -Force
          }
          else {
            Remove-Item -LiteralPath $cachedFfmpeg -Force -ErrorAction SilentlyContinue
            $downloaded = $false
            foreach ($uri in @($env:FFMPEG_URL, $env:FFMPEG_FALLBACK_URL)) {
              try {
                Invoke-DownloadWithRetry -Uri $uri -OutFile $payloadFfmpeg
                if (-not (Test-FfmpegArchive -Path $payloadFfmpeg)) {
                  throw "Downloaded archive from $uri does not contain bin/ffmpeg.exe."
                }
                $downloaded = $true
                break
              }
              catch {
                Write-Warning "FFmpeg download failed from $uri`: $($_.Exception.Message)"
                Remove-Item -LiteralPath $payloadFfmpeg -Force -ErrorAction SilentlyContinue
              }
            }
            if (-not $downloaded) { throw 'Unable to download a valid FFmpeg archive from any configured source.' }
            Copy-Item -LiteralPath $payloadFfmpeg -Destination $cachedFfmpeg -Force
          }
          New-Item -ItemType Directory -Force -Path build/payload/wheels | Out-Null
          python -m pip wheel --wheel-dir build/payload/wheels pip -r requirements.txt
          "UA_VERSION=$env:UA_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer
        shell: pwsh
        run: |
          Push-Location scripts
          try {
            $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if (-not $compiler) {
              $compiler = Get-ChildItem -Path 'C:\Program Files\Inno Setup *\ISCC.exe', 'C:\Program Files (x86)\Inno Setup *\ISCC.exe' -ErrorAction Stop |
                Sort-Object FullName -Descending |
                Select-Object -First 1
            }
            if (-not $compiler) { throw 'ISCC.exe was not found after installing Inno Setup.' }
            & $compiler.Source windows-installer.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Upload-Assistant-Windows-Setup-${{ env.UA_VERSION }}
          path: build/output/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: build/output/*.exe
