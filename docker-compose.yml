# Upload Assistant — CLI-only Docker Compose example
# Run one job with:
#   docker compose run --rm upload-assistant /data/torrents/Release --unattended
services:
  upload-assistant:
    image: ghcr.io/audionut/upload-assistant:latest
    container_name: upload-assistant-cli
    environment:
      PUID: "1000"
      PGID: "1000"
      UA_DATA_DIR: /state
    volumes:
      - /path/to/torrents:/data/torrents:rw
      - /path/to/appdata/Upload-Assistant:/state:rw
      - /path/to/qBittorrent/BT_backup:/torrent_storage_dir:rw
    command: ["--help"]
    stdin_open: true
    tty: true
    stop_grace_period: 15s
